<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineFlix Hub — Perfis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <link rel="stylesheet" href="css/profiles.css" />
  <!-- Supabase CDN removido — usando auth.js local -->
  <script>
    (function() {
      try {
        const d = sessionStorage.getItem('sf_current_user') || localStorage.getItem('sf_current_user');
        if (!d) { 
          sessionStorage.removeItem('profiles_last_check');
          window.location.replace('index.html'); 
          document.documentElement.style.display='none'; 
          throw 0; 
        }
        const u = JSON.parse(d);
        if (!u || !u.id) { 
          sessionStorage.removeItem('profiles_last_check');
          window.location.replace('index.html'); 
          document.documentElement.style.display='none'; 
          throw 0; 
        }
        sessionStorage.setItem('profiles_loaded', 'true');
      } catch(e) { if(e!==0) window.location.replace('index.html'); }
    })();
  </script>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="profiles-header">
    <a href="profiles.html" class="logo">CineFlix<span> Hub</span></a>
    <div></div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="profiles-main">
    <h1 class="profiles-title" id="profilesTitle">Quem está assistindo?</h1>

    <div class="profiles-grid" id="profilesGrid">
      <!-- Perfis renderizados via JS -->
    </div>

    <button class="btn-manage" id="btnManage">Gerenciar Perfis</button>
  </main>

  <!-- ===== PIN MODAL ===== -->
  <div class="pin-modal-overlay" id="pinModal">
    <div class="pin-modal">
      <div class="pin-modal-avatar" id="pinModalAvatar"></div>
      <h2 id="pinModalName">Perfil</h2>
      <p>Digite o PIN de 4 dígitos para entrar</p>
      <div class="pin-inputs">
        <input class="pin-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input class="pin-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input class="pin-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input class="pin-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" />
      </div>
      <div class="pin-error" id="pinError"></div>
      <div class="pin-modal-actions">
        <button class="btn-pin-cancel" id="btnPinCancel">Cancelar</button>
        <button class="btn-pin-confirm" id="btnPinConfirm">Entrar</button>
      </div>
    </div>
  </div>

  <!-- ===== ADD PROFILE MODAL ===== -->
  <div class="add-profile-modal-overlay" id="addProfileModal">
    <div class="add-profile-modal">
      <h2 id="addProfileTitle">Adicionar Perfil</h2>

      <div class="form-field">
        <label>Nome do Perfil</label>
        <input type="text" id="newProfileName" placeholder="Ex: João" maxlength="30" />
      </div>

      <div class="avatar-picker-label">Escolha um Avatar</div>
      <div class="avatar-grid" id="addAvatarGrid">
        <!-- Avatares renderizados via JS -->
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancelAdd">Cancelar</button>
        <button class="btn-save" id="btnSaveProfile">Salvar</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
  // ===== AVATARES — Protagonistas de séries/filmes populares =====
  const AVATARS = [
    { img: 'https://image.tmdb.org/t/p/w185/49WJfeN0moxb9IPfGn8AIqMGskD.jpg', label: 'Walter White' },
    { img: 'https://image.tmdb.org/t/p/w185/ggFHVNu6YYI5L9pCfOacjizRGt.jpg', label: 'Breaking Bad' },
    { img: 'https://image.tmdb.org/t/p/w185/xOMo8BRK7PfcJv9JCnx7s5hj0PX.jpg', label: 'Stranger Things' },
    { img: 'https://image.tmdb.org/t/p/w185/9faGSFi5jam6pDWGNd0p8JcJgXQ.jpg', label: 'The Last of Us' },
    { img: 'https://image.tmdb.org/t/p/w185/etj8E2o0Bud0HkONVQPjyCkIvpv.jpg', label: 'Game of Thrones' },
    { img: 'https://image.tmdb.org/t/p/w185/rcA17r3hfHtRrk3Xs3hXrgGeSGT.jpg', label: 'Oppenheimer' },
    { img: 'https://image.tmdb.org/t/p/w185/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg', label: 'Avengers' },
    { img: 'https://image.tmdb.org/t/p/w185/rqbCbjB19amtOtFQbb3K2lgm2zv.jpg', label: 'Dune' },
    { img: 'https://image.tmdb.org/t/p/w185/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg', label: 'The Witcher' },
    { img: 'https://image.tmdb.org/t/p/w185/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg', label: 'The Boys' },
    { img: 'https://image.tmdb.org/t/p/w185/2e5c2dFFqR81RB2hAaaBMBXFBce.jpg', label: 'Peaky Blinders' },
    { img: 'https://image.tmdb.org/t/p/w185/7WUHnWGx5OrhL2FLR6803nFWBl6.jpg', label: 'House of Dragon' },
    { img: 'https://image.tmdb.org/t/p/w185/wfGfxtBkhBzQfOZw4S8IQZgrH0a.jpg', label: 'Squid Game' },
    { img: 'https://image.tmdb.org/t/p/w185/56v2KjBlU4XaOv9rVYEQypROD7P.jpg', label: 'Wednesday' },
    { img: 'https://image.tmdb.org/t/p/w185/oqCIQhHMBqFGHiJMFSqRFMhGnzP.jpg', label: 'Loki' },
    { img: 'https://image.tmdb.org/t/p/w185/1XDDXPXGiI8id7MrUxK36ke7gkX.jpg', label: 'Mandalorian' },
    { img: 'https://image.tmdb.org/t/p/w185/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg', label: 'Interstellar' },
    { img: 'https://image.tmdb.org/t/p/w185/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg', label: 'Inception' },
  ];

  function avatarSVG() { return ''; }

  function renderAvatarImg(index, size = 120) {
    const av = AVATARS[index] || AVATARS[0];
    if (av.img) {
      return `<img src="${av.img}" alt="${av.label}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:6px;display:block;" referrerpolicy="no-referrer" loading="lazy">`;
    }
    return `<div style="width:${size}px;height:${size}px;background:#333;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:2rem;">🎬</div>`;
  }

  // ===== STATE =====
  let user = null;
  let profiles = [];
  let isManageMode = false;
  let selectedAvatarIndex = 0;
  let pendingProfile = null; // profile waiting for PIN confirmation

  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', async () => {
    console.log('🔵 Profiles: Iniciando...');
    
    try {
      console.log('🔵 Profiles: Chamando Auth.requireAuth...');
      user = Auth.requireAuth('index.html');
      console.log('🔵 Profiles: requireAuth retornou:', user);
      
      if (!user) {
        console.log('🔴 Profiles: Sem usuário, redirecionando...');
        return;
      }

      console.log('🔵 Profiles: Buscando perfis do usuário:', user.id);
      profiles = Auth.getProfiles(user.id);
      console.log('🔵 Profiles: Perfis encontrados:', profiles);

      // Se não tem perfis, cria um padrão
      if (!profiles || !profiles.length) {
        console.log('🟡 Profiles: Nenhum perfil encontrado, criando padrão...');
        const newProfile = { id: Date.now(), name: user.name, avatar: 0, pin: null, isKids: false };
        Auth.saveProfiles(user.id, [newProfile]);
        profiles = Auth.getProfiles(user.id);
        console.log('🟡 Profiles: Perfis após criação:', profiles);
      }

      console.log('🟢 Profiles: Renderizando perfis...');
      renderProfiles();
    } catch (error) {
      console.error('🔴 Profiles: Erro:', error);
      alert('Erro ao carregar perfis: ' + error.message);
    }
    setupAddModal();
    setupPinModal();
    setupManageButton();
  });

  // ===== RENDER PROFILES =====
  function renderProfiles() {
    const grid = document.getElementById('profilesGrid');
    grid.innerHTML = '';

    profiles.forEach((profile, idx) => {
      const item = document.createElement('div');
      item.className = 'profile-item';
      item.dataset.idx = idx;

      const av = AVATARS[profile.avatar] || AVATARS[0];
      const avatarContent = av.img
        ? `<img src="${av.img}" alt="${av.label}" style="width:100%;height:100%;object-fit:cover;display:block;" referrerpolicy="no-referrer" loading="lazy">`
        : `<span style="font-size:2rem;">🎬</span>`;

      item.innerHTML = `
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" style="overflow:hidden;background:#111;">
            ${avatarContent}
            ${isManageMode ? `
            <div class="profile-edit-overlay">
              <button class="btn-edit-profile" title="Editar" onclick="event.stopPropagation();editProfile(${idx})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
              ${profiles.length > 1 ? `
              <button class="btn-delete-profile" title="Excluir" onclick="event.stopPropagation();deleteProfile(${idx})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                  <path d="M10 11v6M14 11v6"/>
                  <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                </svg>
              </button>` : ''}
            </div>` : ''}
          </div>
          ${profile.pin ? `
          <div class="profile-lock">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>` : ''}
        </div>
        <span class="profile-name">${profile.name}</span>
      `;

      if (!isManageMode) {
        item.addEventListener('click', () => selectProfile(profile));
      }

      grid.appendChild(item);
    });

    // Botão adicionar (máx 3 perfis)
    if (profiles.length < 3) {
      const addItem = document.createElement('div');
      addItem.className = 'profile-add';
      addItem.innerHTML = `
        <button class="profile-add-btn" id="btnAddProfile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <span class="profile-add-label">Adicionar perfil</span>
      `;
      addItem.addEventListener('click', () => openAddModal());
      grid.appendChild(addItem);
    }

    // Atualiza botão gerenciar
    const btnManage = document.getElementById('btnManage');
    if (isManageMode) {
      btnManage.textContent = 'Concluído';
      btnManage.className = 'btn-done';
      document.getElementById('profilesTitle').textContent = 'Gerenciar Perfis';
    } else {
      btnManage.textContent = 'Gerenciar Perfis';
      btnManage.className = 'btn-manage';
      document.getElementById('profilesTitle').textContent = 'Quem está assistindo?';
    }
  }

  // ===== SELECT PROFILE =====
  function selectProfile(profile) {
    if (profile.pin) {
      openPinModal(profile);
    } else {
      Auth.setCurrentProfile(profile);
      window.location.href = 'home.html';
    }
  }

  // ===== MANAGE MODE =====
  function setupManageButton() {
    document.getElementById('btnManage').addEventListener('click', () => {
      isManageMode = !isManageMode;
      renderProfiles();
    });
  }

  // ===== EDIT PROFILE =====
  window.editProfile = function(idx) {
    const profile = profiles[idx];
    window.location.href = `settings.html?profileId=${profile.id}`;
  };

  // ===== DELETE PROFILE =====
  window.deleteProfile = function(idx) {
    if (profiles.length <= 1) return;
    if (!confirm(`Excluir o perfil "${profiles[idx].name}"?`)) return;
    profiles.splice(idx, 1);
    Auth.saveProfiles(user.id, profiles);
    renderProfiles();
  };

  // ===== PIN MODAL =====
  function setupPinModal() {
    const inputs = document.querySelectorAll('.pin-input');

    inputs.forEach((input, i) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val;
        if (val && i < inputs.length - 1) inputs[i + 1].focus();
        if (i === inputs.length - 1 && val) confirmPin();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && i > 0) {
          inputs[i - 1].focus();
          inputs[i - 1].value = '';
        }
      });
    });

    document.getElementById('btnPinCancel').addEventListener('click', closePinModal);
    document.getElementById('btnPinConfirm').addEventListener('click', confirmPin);

    document.getElementById('pinModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('pinModal')) closePinModal();
    });
  }

  function openPinModal(profile) {
    pendingProfile = profile;
    const av = AVATARS[profile.avatar] || AVATARS[0];
    const avatarHtml = av.img
      ? `<img src="${av.img}" alt="${av.label}" style="width:80px;height:80px;border-radius:8px;object-fit:cover;display:block;" referrerpolicy="no-referrer">`
      : `<div style="width:80px;height:80px;background:#333;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem;">🎬</div>`;
    document.getElementById('pinModalAvatar').innerHTML = avatarHtml;
    document.getElementById('pinModalName').textContent = profile.name;
    document.getElementById('pinError').textContent = '';
    document.querySelectorAll('.pin-input').forEach(i => { i.value = ''; i.classList.remove('error'); });
    document.getElementById('pinModal').classList.add('show');
    setTimeout(() => document.querySelector('.pin-input').focus(), 100);
  }

  function closePinModal() {
    document.getElementById('pinModal').classList.remove('show');
    pendingProfile = null;
    document.querySelectorAll('.pin-input').forEach(i => { i.value = ''; i.classList.remove('error'); });
  }

  function confirmPin() {
    const inputs = document.querySelectorAll('.pin-input');
    const pin = Array.from(inputs).map(i => i.value).join('');
    if (pin.length < 4) {
      document.getElementById('pinError').textContent = 'Digite os 4 dígitos do PIN.';
      return;
    }
    if (pin === pendingProfile.pin) {
      Auth.setCurrentProfile(pendingProfile);
      window.location.href = 'home.html';
    } else {
      document.getElementById('pinError').textContent = 'PIN incorreto. Tente novamente.';
      inputs.forEach(i => { i.classList.add('error'); i.value = ''; });
      setTimeout(() => inputs.forEach(i => i.classList.remove('error')), 600);
      inputs[0].focus();
    }
  }

  // ===== ADD PROFILE MODAL =====
  function setupAddModal() {
    const grid = document.getElementById('addAvatarGrid');
    AVATARS.forEach((av, i) => {
      const opt = document.createElement('div');
      opt.className = 'avatar-option' + (i === 0 ? ' selected' : '');
      opt.title = av.label;
      if (av.img) {
        opt.style.cssText = 'background:#111;overflow:hidden;';
        opt.innerHTML = `<img src="${av.img}" alt="${av.label}" style="width:100%;height:100%;object-fit:cover;display:block;" referrerpolicy="no-referrer" loading="lazy">`;
      } else {
        opt.style.background = av.gradient || '#333';
      }
      opt.addEventListener('click', () => {
        document.querySelectorAll('#addAvatarGrid .avatar-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedAvatarIndex = i;
      });
      grid.appendChild(opt);
    });

    document.getElementById('btnCancelAdd').addEventListener('click', closeAddModal);
    document.getElementById('addProfileModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('addProfileModal')) closeAddModal();
    });

    document.getElementById('btnSaveProfile').addEventListener('click', saveNewProfile);
  }

  function openAddModal() {
    selectedAvatarIndex = 0;
    document.getElementById('newProfileName').value = '';
    document.getElementById('newProfileKids').checked = false;
    document.querySelectorAll('#addAvatarGrid .avatar-option').forEach((o, i) => {
      o.classList.toggle('selected', i === 0);
    });
    document.getElementById('addProfileTitle').textContent = 'Adicionar Perfil';
    document.getElementById('addProfileModal').classList.add('show');
    setTimeout(() => document.getElementById('newProfileName').focus(), 100);
  }

  function closeAddModal() {
    document.getElementById('addProfileModal').classList.remove('show');
  }

  function saveNewProfile() {
    const name = document.getElementById('newProfileName').value.trim();
    if (!name) {
      document.getElementById('newProfileName').focus();
      return;
    }
    const newProfile = {
      id: Date.now(),
      name,
      avatar: selectedAvatarIndex,
      pin: null,
      isKids: false
    };
    profiles.push(newProfile);
    Auth.saveProfiles(user.id, profiles);
    closeAddModal();
    renderProfiles();
  }

  // ESC key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closePinModal();
      closeAddModal();
    }
  });
  </script>
</body>
</html>
