<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta Admin - CineFlix Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .result.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .result.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .result.show {
      display: block;
    }
    .link {
      margin-top: 20px;
      text-align: center;
    }
    .link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 Criar Conta Admin</h1>
    <p>Preencha os dados abaixo para criar uma conta de administrador no CineFlix Hub.</p>
    
    <form id="adminForm">
      <div class="form-group">
        <label for="name">Nome Completo</label>
        <input type="text" id="name" value="Jonatan Ott" required>
      </div>
      
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" value="marlonott75@gmail.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" value="admin123" required>
      </div>
      
      <button type="submit">✨ Criar Conta Admin</button>
    </form>
    
    <div id="result" class="result"></div>
    
    <div class="link">
      <a href="index.html">← Voltar para Login</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('adminForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const result = document.getElementById('result');
      
      if (!name || !email || !password) {
        result.className = 'result error show';
        result.textContent = '❌ Preencha todos os campos!';
        return;
      }
      
      // Pegar usuários existentes
      const users = Auth.getUsers();
      
      // Verificar se já existe
      const existing = users.find(u => u.email.toLowerCase() === email.toLowerCase());
      if (existing) {
        // Se já existe, apenas promover para admin
        existing.role = 'admin';
        existing.name = name;
        existing.password = password;
        Auth.saveUsers(users);
        
        result.className = 'result success show';
        result.innerHTML = `
          ✅ <strong>Conta atualizada para Admin!</strong><br><br>
          <strong>Nome:</strong> ${name}<br>
          <strong>Email:</strong> ${email}<br>
          <strong>Senha:</strong> ${password}<br>
          <strong>Função:</strong> Administrador<br><br>
          <a href="index.html" style="color:#155724;font-weight:bold;">→ Fazer Login Agora</a>
        `;
      } else {
        // Criar nova conta admin
        const newAdmin = {
          id: Date.now(),
          email: email,
          password: password,
          name: name,
          role: 'admin',
          avatar: name.charAt(0).toUpperCase(),
          isPremium: true, // Admin sempre VIP
        };
        
        users.push(newAdmin);
        Auth.saveUsers(users);
        
        // Criar perfil padrão
        Auth.saveProfiles(newAdmin.id, [{
          id: Date.now() + 1,
          name: name,
          avatar: 0,
          pin: null,
          isKids: false
        }]);
        
        result.className = 'result success show';
        result.innerHTML = `
          ✅ <strong>Conta Admin criada com sucesso!</strong><br><br>
          <strong>Nome:</strong> ${name}<br>
          <strong>Email:</strong> ${email}<br>
          <strong>Senha:</strong> ${password}<br>
          <strong>Função:</strong> Administrador<br>
          <strong>VIP:</strong> Sim (vitalício)<br><br>
          <a href="index.html" style="color:#155724;font-weight:bold;">→ Fazer Login Agora</a>
        `;
      }
      
      // Limpar formulário
      document.getElementById('adminForm').reset();
    });
  </script>
</body>
</html>
