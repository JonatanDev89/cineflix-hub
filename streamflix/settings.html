<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Impede cache da página protegida -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>CineFlix Hub — Configurações do Perfil</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <link rel="stylesheet" href="css/settings.css" />
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Verificação de segurança — roda ANTES de qualquer conteúdo renderizar -->
  <script>
    (function() {
      try {
        const d = sessionStorage.getItem('sf_current_user') || localStorage.getItem('sf_current_user');
        if (!d) { window.location.replace('index.html'); document.documentElement.style.display='none'; throw 0; }
        const u = JSON.parse(d);
        if (!u || !u.id) { window.location.replace('index.html'); document.documentElement.style.display='none'; throw 0; }
      } catch(e) { if(e!==0) window.location.replace('index.html'); }
    })();
  </script>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="settings-header">
    <a href="profiles.html" class="logo">CineFlix<span> Hub</span></a>
    <a href="profiles.html" class="btn-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Voltar aos Perfis
    </a>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="settings-main">
    <h1 class="settings-page-title">Configurações do Perfil</h1>
    <p class="settings-page-subtitle">Personalize seu perfil de visualização</p>

    <!-- Preview do perfil atual -->
    <div class="profile-preview" id="profilePreview">
      <div class="preview-avatar" id="previewAvatar"></div>
      <div class="preview-info">
        <h3 id="previewName">Carregando...</h3>
        <p id="previewEmail"></p>
        <div class="preview-badges" id="previewBadges"></div>
      </div>
    </div>

    <!-- ===== NOME ===== -->
    <div class="settings-section">
      <div class="settings-section-title">Informações do Perfil</div>
      <div class="form-field">
        <label for="profileName">Nome do Perfil</label>
        <input type="text" id="profileName" placeholder="Nome do perfil" maxlength="30" />
        <div class="hint">Máximo de 30 caracteres</div>
      </div>
    </div>

    <!-- ===== AVATAR ===== -->
    <div class="settings-section">
      <div class="settings-section-title">Avatar</div>
      <div class="avatar-picker-label">Escolha um avatar para o seu perfil</div>
      <div class="avatar-grid" id="avatarGrid">
        <!-- Renderizado via JS -->
      </div>
    </div>

    <!-- ===== PIN ===== -->
    <div class="settings-section">
      <div class="settings-section-title">Segurança</div>      <div class="pin-section">
        <div class="pin-section-header">
          <div>
            <h4>PIN de Acesso</h4>
            <p>Proteja este perfil com um PIN de 4 dígitos</p>
          </div>
          <button class="btn-toggle-pin" id="btnTogglePin">Definir PIN</button>
        </div>
        <div id="pinInputsWrap" style="display:none;">
          <div class="pin-inputs-row">
            <input class="pin-digit" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" placeholder="•" />
            <input class="pin-digit" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" placeholder="•" />
            <input class="pin-digit" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" placeholder="•" />
            <input class="pin-digit" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" placeholder="•" />
          </div>
        </div>
      </div>
    </div>

    <!-- ===== SALVAR ===== -->
    <div class="save-section">
      <button class="btn-save-settings" id="btnSave">Salvar Alterações</button>
      <button class="btn-delete-profile" id="btnDeleteProfile">Excluir Perfil</button>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
  // ===== AVATARES — Protagonistas de séries/filmes populares =====
  const AVATARS = [
    { img: 'https://image.tmdb.org/t/p/w185/49WJfeN0moxb9IPfGn8AIqMGskD.jpg', label: 'Walter White' },
    { img: 'https://image.tmdb.org/t/p/w185/ggFHVNu6YYI5L9pCfOacjizRGt.jpg', label: 'Breaking Bad' },
    { img: 'https://image.tmdb.org/t/p/w185/xOMo8BRK7PfcJv9JCnx7s5hj0PX.jpg', label: 'Stranger Things' },
    { img: 'https://image.tmdb.org/t/p/w185/9faGSFi5jam6pDWGNd0p8JcJgXQ.jpg', label: 'The Last of Us' },
    { img: 'https://image.tmdb.org/t/p/w185/etj8E2o0Bud0HkONVQPjyCkIvpv.jpg', label: 'Game of Thrones' },
    { img: 'https://image.tmdb.org/t/p/w185/rcA17r3hfHtRrk3Xs3hXrgGeSGT.jpg', label: 'Oppenheimer' },
    { img: 'https://image.tmdb.org/t/p/w185/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg', label: 'Avengers' },
    { img: 'https://image.tmdb.org/t/p/w185/rqbCbjB19amtOtFQbb3K2lgm2zv.jpg', label: 'Dune' },
    { img: 'https://image.tmdb.org/t/p/w185/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg', label: 'The Witcher' },
    { img: 'https://image.tmdb.org/t/p/w185/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg', label: 'The Boys' },
    { img: 'https://image.tmdb.org/t/p/w185/2e5c2dFFqR81RB2hAaaBMBXFBce.jpg', label: 'Peaky Blinders' },
    { img: 'https://image.tmdb.org/t/p/w185/7WUHnWGx5OrhL2FLR6803nFWBl6.jpg', label: 'House of Dragon' },
    { img: 'https://image.tmdb.org/t/p/w185/wfGfxtBkhBzQfOZw4S8IQZgrH0a.jpg', label: 'Squid Game' },
    { img: 'https://image.tmdb.org/t/p/w185/56v2KjBlU4XaOv9rVYEQypROD7P.jpg', label: 'Wednesday' },
    { img: 'https://image.tmdb.org/t/p/w185/oqCIQhHMBqFGHiJMFSqRFMhGnzP.jpg', label: 'Loki' },
    { img: 'https://image.tmdb.org/t/p/w185/1XDDXPXGiI8id7MrUxK36ke7gkX.jpg', label: 'Mandalorian' },
    { img: 'https://image.tmdb.org/t/p/w185/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg', label: 'Interstellar' },
    { img: 'https://image.tmdb.org/t/p/w185/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg', label: 'Inception' },
  ];

  function avatarSVG() { return ''; } // não usado mais — avatares são fotos

  // ===== STATE =====
  let user = null;
  let profiles = [];
  let currentProfile = null;
  let profileIndex = -1;
  let selectedAvatar = 0;
  let pinEnabled = false;
  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', async () => {
    user = await Auth.requireAuth('index.html');
    if (!user) return;

    profiles = Auth.getProfiles(user.id);

    // Pega profileId da URL
    const params = new URLSearchParams(window.location.search);
    const profileId = params.get('profileId');

    if (profileId) {
      profileIndex = profiles.findIndex(p => String(p.id) === String(profileId));
      currentProfile = profiles[profileIndex];
    }

    // Fallback: usa perfil ativo da sessão
    if (!currentProfile) {
      const activeProfile = Auth.getCurrentProfile();
      if (activeProfile) {
        profileIndex = profiles.findIndex(p => p.id === activeProfile.id);
        currentProfile = profiles[profileIndex];
      }
    }

    // Fallback: primeiro perfil
    if (!currentProfile && profiles.length) {
      profileIndex = 0;
      currentProfile = profiles[0];
    }

    if (!currentProfile) {
      window.location.href = 'profiles.html';
      return;
    }

    loadProfileData();
    renderAvatarGrid();
    setupPinSection();
    setupSaveButton();
    setupDeleteButton();
  });

  // ===== LOAD PROFILE DATA =====
  function loadProfileData() {
    document.getElementById('profileName').value = currentProfile.name;
    selectedAvatar = currentProfile.avatar || 0;
    pinEnabled = !!currentProfile.pin;
    updatePreview();
    updatePinButton();
  }

  // ===== UPDATE PREVIEW =====
  function updatePreview() {
    const av = AVATARS[selectedAvatar] || AVATARS[0];
    const avatarHtml = av.img
      ? `<img src="${av.img}" alt="${av.label}" style="width:80px;height:80px;border-radius:8px;object-fit:cover;display:block;" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div style="display:none;width:80px;height:80px;background:#333;border-radius:8px;align-items:center;justify-content:center;font-size:2rem;">🎬</div>`
      : `<div style="width:80px;height:80px;background:${av.gradient};border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem;">🎬</div>`;
    document.getElementById('previewAvatar').innerHTML = avatarHtml;
    document.getElementById('previewName').textContent = document.getElementById('profileName').value || currentProfile.name;
    document.getElementById('previewEmail').textContent = user.email;

    const badges = document.getElementById('previewBadges');
    badges.innerHTML = '';
    if (pinEnabled) {
      badges.innerHTML += '<span class="badge-pin">🔒 PIN ativo</span>';
    }
  }

  // ===== AVATAR GRID =====
  function renderAvatarGrid() {
    const grid = document.getElementById('avatarGrid');
    grid.innerHTML = '';
    AVATARS.forEach((av, i) => {
      const opt = document.createElement('div');
      opt.className = 'avatar-option' + (i === selectedAvatar ? ' selected' : '');
      opt.title = av.label;
      if (av.img) {
        opt.style.cssText = 'background:#111;overflow:hidden;';
        opt.innerHTML = `<img src="${av.img}" alt="${av.label}" style="width:100%;height:100%;object-fit:cover;display:block;" referrerpolicy="no-referrer" loading="lazy">`;
      } else {
        opt.style.background = av.gradient;
        opt.innerHTML = `<span style="font-size:1.4rem;">🎬</span>`;
      }
      opt.addEventListener('click', () => {
        document.querySelectorAll('#avatarGrid .avatar-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedAvatar = i;
        updatePreview();
      });
      grid.appendChild(opt);
    });
  }

  // ===== PIN SECTION =====
  function setupPinSection() {
    const pinInputs = document.querySelectorAll('.pin-digit');

    pinInputs.forEach((input, i) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val;
        if (val && i < pinInputs.length - 1) pinInputs[i + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && i > 0) {
          pinInputs[i - 1].focus();
          pinInputs[i - 1].value = '';
        }
      });
    });

    document.getElementById('btnTogglePin').addEventListener('click', () => {
      pinEnabled = !pinEnabled;
      updatePinButton();
      updatePreview();
    });
  }

  function updatePinButton() {
    const btn = document.getElementById('btnTogglePin');
    const wrap = document.getElementById('pinInputsWrap');
    if (pinEnabled) {
      btn.textContent = 'Remover PIN';
      btn.classList.add('active');
      wrap.style.display = 'block';
      // Preenche com PIN atual se existir
      if (currentProfile.pin) {
        const digits = document.querySelectorAll('.pin-digit');
        currentProfile.pin.split('').forEach((d, i) => {
          if (digits[i]) digits[i].value = d;
        });
      }
    } else {
      btn.textContent = 'Definir PIN';
      btn.classList.remove('active');
      wrap.style.display = 'none';
      document.querySelectorAll('.pin-digit').forEach(d => d.value = '');
    }
  }

  // ===== SAVE =====
  function setupSaveButton() {
    document.getElementById('profileName').addEventListener('input', updatePreview);

    document.getElementById('btnSave').addEventListener('click', () => {
      const name = document.getElementById('profileName').value.trim();
      if (!name) {
        toast('Digite um nome para o perfil.', 'error');
        document.getElementById('profileName').focus();
        return;
      }

      let pin = null;
      if (pinEnabled) {
        const digits = document.querySelectorAll('.pin-digit');
        pin = Array.from(digits).map(d => d.value).join('');
        if (pin.length < 4 || !/^\d{4}$/.test(pin)) {
          toast('Digite um PIN de 4 dígitos numéricos.', 'error');
          return;
        }
      }

      profiles[profileIndex] = {
        ...currentProfile,
        name,
        avatar: selectedAvatar,
        pin: pinEnabled ? pin : null,
        isKids: false
      };

      Auth.saveProfiles(user.id, profiles);

      // Atualiza perfil ativo na sessão se for o mesmo
      const activeProfile = Auth.getCurrentProfile();
      if (activeProfile && activeProfile.id === currentProfile.id) {
        Auth.setCurrentProfile(profiles[profileIndex]);
      }

      currentProfile = profiles[profileIndex];
      toast('Perfil salvo com sucesso!', 'success');
      updatePreview();
    });
  }

  // ===== DELETE =====
  function setupDeleteButton() {
    const btn = document.getElementById('btnDeleteProfile');
    if (profiles.length <= 1) {
      btn.style.display = 'none';
      return;
    }
    btn.addEventListener('click', () => {
      if (!confirm(`Excluir o perfil "${currentProfile.name}"? Esta ação não pode ser desfeita.`)) return;
      profiles.splice(profileIndex, 1);
      Auth.saveProfiles(user.id, profiles);

      // Limpa perfil ativo se for o excluído
      const activeProfile = Auth.getCurrentProfile();
      if (activeProfile && activeProfile.id === currentProfile.id) {
        Auth.clearProfile();
      }

      window.location.href = 'profiles.html';
    });
  }

  // ===== TOAST =====
  function toast(msg, type = 'info') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const icons = { success: '✓', error: '✕', info: 'ℹ' };
    t.innerHTML = `<span>${icons[type] || 'ℹ'}</span><span>${msg}</span>`;
    c.appendChild(t);
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateX(20px)';
      t.style.transition = 'all 0.3s';
      setTimeout(() => t.remove(), 300);
    }, 3500);
  }
  </script>
</body>
</html>
